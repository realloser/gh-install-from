name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        run: make test

      - name: Run linters
        run: make lint

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.27'
          cache: true

      - name: Set version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV

      - name: Build release artifacts
        run: make -j$(nproc) binaries

      - name: Verify binary formats
        run: |
          cd dist
          check() { file "$1" | grep -q "$2" || { echo "::error::$1 is not $2"; file "$1"; exit 1; }; }
          check gh-install-from-darwin-amd64 "Mach-O 64-bit.*x86_64"
          check gh-install-from-darwin-arm64 "Mach-O 64-bit.*arm64"
          check gh-install-from-linux-386 "ELF 32-bit.*Intel 80386"
          check gh-install-from-linux-amd64 "ELF 64-bit.*x86-64"
          check gh-install-from-linux-arm "ELF 32-bit.*ARM"
          check gh-install-from-linux-arm64 "ELF 64-bit.*ARM aarch64"
          check gh-install-from-windows-386.exe "PE32 executable.*80386"
          check gh-install-from-windows-amd64.exe "PE32+ executable.*x86-64"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum gh-install-from-* > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/gh-install-from-*
            dist/checksums.txt
          draft: false
          prerelease: false
          generate_release_notes: true
          name: Release ${{ env.VERSION }}
          body: |
            ## Release ${{ env.VERSION }}

            ### Installation
            ```bash
            gh extension install realloser/gh-install-from
            ```

            ### Supported Platforms
            - macOS (amd64, arm64)
            - Linux (386, amd64, arm, arm64)
            - Windows (386, amd64)

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Notify about successful release
        run: |
          echo "Release ${{ github.ref_name }} has been published successfully!"
          # Add notification mechanisms here (e.g., Slack, Discord, etc.) 